name: just_audio
description: A feature-rich audio player for Flutter. Loop, clip and sequence any sound from any source (asset/file/URL/stream) in gapless playlists.
version: 0.10.5
repository: https://github.com/ryanheise/just_audio/tree/minor/just_audio
issue_tracker: https://github.com/ryanheise/just_audio/issues
topics:
  - audio
  - sound
  - player
  - background

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  # Reference the fork's own sibling packages via git so a single git dependency
  # on this `just_audio` transitively pulls the forked web/platform_interface —
  # no dependency_override needed downstream (overrides don't propagate; git
  # `dependencies` do). Pinned to the branch; pubspec.lock records the commit.
  just_audio_platform_interface:
    git:
      url: https://github.com/keinerVonIhnen/just_audio.git
      ref: gp-ios-preserves-pitch
      path: just_audio_platform_interface
  just_audio_web:
    git:
      url: https://github.com/keinerVonIhnen/just_audio.git
      ref: gp-ios-preserves-pitch
      path: just_audio_web
  audio_session: ">=0.1.24 <0.3.0"
  rxdart: '>=0.26.0 <0.29.0'
  path: ^1.8.0
  path_provider: ^2.0.0
  async: ^2.5.0
  uuid: '>=3.0.1 <5.0.0'
  crypto: ^3.0.0
  meta: ^1.3.0
  flutter:
    sdk: flutter
  synchronized: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  plugin_platform_interface: ^2.0.0
  flutter_lints: ^2.0.1

flutter:
  plugin:
    platforms:
      android:
        package: com.ryanheise.just_audio
        pluginClass: JustAudioPlugin
      ios:
        pluginClass: JustAudioPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: JustAudioPlugin
        sharedDarwinSource: true
      web:
        default_package: just_audio_web
