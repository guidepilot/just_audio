name: just_audio_web
description: Web platform implementation of just_audio. This implementation is endorsed and therefore doesn't require a direct dependency.
homepage: https://github.com/ryanheise/just_audio/tree/master/just_audio_web
version: 0.4.16

flutter:
  plugin:
    platforms:
      web:
        pluginClass: JustAudioPlugin
        fileName: just_audio_web.dart

dependencies:
  # git ref to the fork's own platform_interface so the fork is self-contained
  # (see just_audio/pubspec.yaml). pubspec.lock records the resolved commit.
  just_audio_platform_interface:
    git:
      url: https://github.com/keinerVonIhnen/just_audio.git
      ref: gp-ios-preserves-pitch
      path: just_audio_platform_interface
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  synchronized: ^3.2.0

dev_dependencies:
  flutter_lints: ^2.0.1

environment:
  sdk: ^3.2.1
  flutter: '>=3.16.0'
